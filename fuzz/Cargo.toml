[package]
name = "gqodb-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz harness for the gqodb readers and decoders (not part of the main workspace)"

[package.metadata]
cargo-fuzz = true

# Own workspace: the stable CI gate (`cargo ... --workspace`) never builds this crate.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
anyhow = "1"
arrow-array = "=59.3.0"
arrow-schema = { version = "=59.3.0", features = ["serde"] }
bytes = "1"
crc32fast = "1.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
gqodb-types = { path = "../crates/gqodb-types" }
gqodb-blocks = { path = "../crates/gqodb-blocks" }
gqodb-store = { path = "../crates/gqodb-store" }
gqodb-codec = { path = "../crates/gqodb-codec" }

[lib]
name = "gqodb_fuzz"
path = "src/lib.rs"

[profile.release]
debug = 1

[[example]]
name = "seedgen"
path = "examples/seedgen.rs"

[[bin]]
name = "block_decode"
path = "fuzz_targets/block_decode.rs"
test = false
doc = false
bench = false

