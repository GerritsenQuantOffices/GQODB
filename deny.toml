# cargo-deny policy for the GQODB open layer (Apache-2.0).
# Run: cargo deny check          (needs network once to fetch the RustSec advisory database)

[graph]
# Check every feature combination, including the optional `zstd-input` feature of gqodb-blocks.
all-features = true

[advisories]
# A security advisory is never ignored without a written reason in this list.
ignore = []
yanked = "deny"
unmaintained = "all"

[licenses]
# Only licences that are compatible with distributing this repository under Apache-2.0.
# Each entry is used by at least one dependency; `cargo deny` warns if one becomes unused.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
# Several semver-incompatible versions of one crate are reported, not denied: they come
# from the Arrow/Parquet dependency tree, and exact pins (=59.3.0) are deliberate.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry an explicit version, so wildcards stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
