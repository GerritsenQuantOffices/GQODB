[package]
name = "gqodb-blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-only block feasibility experiments for gqodb"

[dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
anyhow = "1.0"
arrow-array = "=59.3.0"
bytes = "1"
bitpacking = { version = "=0.9.3", default-features = false, features = ["bitpacker4x"] }
crc32fast = "1.5"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "lz4", "snap", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
arrow-schema = { version = "=59.3.0", features = ["serde"] }


[features]
default = []
# Decode zstd-compressed Parquet *inputs*; the original B06 trade samples were
# zstd-9 Parquet. Pulls the native zstd library from crates.io. It only reads
# inputs and is never one of the measured codecs.
zstd-input = ["parquet/zstd"]

[lib]
path = "prototype/src/lib.rs"

[[bin]]
name = "gqodb-blocks"
path = "prototype/src/main.rs"

[[example]]
name = "inspect"
path = "prototype/examples/inspect.rs"


[[example]]
name = "paired_benchmark"
path = "prototype/examples/paired_benchmark.rs"


[[example]]
name = "real_benchmark"
path = "prototype/examples/real_benchmark.rs"

[[test]]
name = "batch"
path = "prototype/tests/batch.rs"

[[test]]
name = "real_roundtrip"
path = "prototype/tests/real_roundtrip.rs"

[[test]]
name = "roundtrip"
path = "prototype/tests/roundtrip.rs"
